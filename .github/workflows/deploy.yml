name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Le build Docker peut dépasser les 10 minutes par défaut
          # d'appleboy/ssh-action et couper la connexion SSH avant même
          # d'arriver à `docker compose up -d` (vu sur le backend Sign).
          command_timeout: "30m"
          script: |
            set -e
            cd /var/www/nanei-api

            # Récupérer le nouveau code — `set -e` fait échouer tout le
            # déploiement si le pull échoue, au lieu de continuer
            # silencieusement avec l'ancien code.
            # --rebase : évite un conflit de branches divergentes si le VPS
            # a un jour un commit local (config spécifique à la machine).
            git pull --rebase origin main

            # Mise en service : build de la nouvelle image, sauvegarde de la
            # base, MIGRATIONS AUTOMATIQUES (src/migrations/) puis redémarrage
            # du backend et contrôle /health. Si une migration échoue,
            # l'ancienne version reste en ligne et ce job passe en échec.
            # Détail et ordre des étapes : deploy/release.sh
            bash deploy/release.sh
